<div class="header">
  @for (tab of this.labels; track tab; let index = $index) {
    <div
      (click)="onActivateTab(index)"
      class="itemlabel bottomLine"
      [ngStyle]="{ color: tab.active ? color : 'inherit', opacity: tab.active ? 1 : 0.7, fontWeight: tab.active ? 500 : 'inherit' }"
      >
      {{ tab.label }}
      @if (tab.active) {
        <div [style.backgroundColor]="this.color"></div>
      }
    </div>
  }
</div>

<div class="body">
  <ng-content></ng-content>
</div>
